# Ospreylia FanView — Netlify configuration
# Single-file static site. No build step required.

[build]
  publish = "."
  command = ""

# Security headers — match the CSP locked into the HTML <meta> tag.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options          = "DENY"
    X-Content-Type-Options   = "nosniff"
    Referrer-Policy          = "strict-origin-when-cross-origin"
    Permissions-Policy       = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    # CSP mirrors the in-page meta tag for defense in depth.
    Content-Security-Policy  = "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    # Long cache for the HTML — invalidate on every deploy via Netlify's deploy hash.
    Cache-Control            = "public, max-age=0, must-revalidate"
